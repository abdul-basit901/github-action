name: input or parameter demo
on: 
  workflow_dispatch:
    inputs:
      environment:
        description: choose the environment to deploy
        required: true
        default: dev
        type: choice
        options:
           - dev
           - test
           - prod
      artifact_tag:
        description: choose the git tag to deploy
        required: true

jobs:
    input-parameter-demo:
      runs-on: ubuntu-latest
      steps: 
        - name: deploy the app
          run: echo "deploying the ${{ inputs.artifact_tag }} app to ${{ inputs.environment }}"

